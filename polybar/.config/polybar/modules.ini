; Workspace module
[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
label = %name%

label-active = %name%
label-active-background = ${colors.mauve}
label-active-foreground = ${colors.crust}
label-active-underline= ${colors.lauve}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

; System tray
[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

; Window title
[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

; Audio module
[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

; Keyboard module
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

; NVMe temperature module
[module/nvme-temp]
type = custom/script
exec = ~/dotfiles/polybar/.config/polybar/nvme-temp.sh
interval = 2
format-prefix = "NVME Temp "
format-prefix-foreground = ${colors.primary}
label = %output%
label-foreground = ${colors.text}

; Filesystem module
[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
format-mounted = <label-mounted>
format-mounted-prefix = "DISK "
format-mounted-prefix-foreground = ${colors.primary}
label-mounted = %used% | %total%
label-unmounted = n/a

; Memory module
[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %used% | %total%

; CPU module
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

; CPU temperature module
[module/cpu-temp]
type = custom/script
interval = 2
exec = ~/.config/polybar/cpu-temp.sh
format-prefix = "CPU Temp "
format-prefix-foreground = ${colors.primary}
label = %output%

; GPU temperature module
[module/gpu-temp]
type = custom/script
interval = 2
exec = nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits | awk '{print $1 "°C"}'
format-prefix = "GPU Temp "
format-prefix-foreground = ${colors.primary}
label = %output%

; Battery module
[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 99
low-at = 10
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <label-low> <animation-low>

label-charging = "%percentage%% "
label-discharging = "%percentage%% "
label-full = " 100% "
label-low = "%percentage% "

ramp-capacity-0 = " "
ramp-capacity-1 = " "
ramp-capacity-2 = " "
ramp-capacity-3 = " "
ramp-capacity-4 = " "

animation-charging-0 = " "
animation-charging-1 = " "
animation-charging-2 = " "
animation-charging-3 = " "
animation-charging-4 = " "
animation-charging-framerate = 750
animation-charging-foreground = ${colors.peach}

animation-low-0 = "  "
animation-low-1 = "  "
animation-low-framerate = 1500
animation-low-foreground = ${colors.red}

format-charging-foreground = ${colors.primary}
format-discharging-foreground = ${colors.primary}
format-full-foreground = ${colors.green}
ramp-capacity-foreground = ${colors.primary}

; Network base
[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

; Ethernet module
[module/eth]
inherit = network-base
interface-type = wired
format-connected-prefix = "ETH "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %downspeed% ↓ %upspeed% ↑

; Wireless module
[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#F0C674}%ifname%%{F-} %essid%

; Date/time module
[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}
